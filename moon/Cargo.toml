[package]
name = "shanlian-moon"
version = "0.1.0"
edition = "2021"
description = "闪连 VPN Moon 节点 - 流量中继服务器"

[dependencies]
# 异步运行时
tokio = { version = "1.35", features = ["full"] }

# 网络
tokio-rustls = "0.24"
rustls = "0.21"
webpki = "0.22"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 配置解析
clap = { version = "4.5", features = ["derive"] }
config = "0.13"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# 加密
chacha20poly1305 = "0.10"
poly1305 = "0.8"
cipher = "0.4"
aead = "0.5"

# 哈希和校验
crc32fast = "1.3"
sha2 = "0.10"

# 时间
chrono = { version = "0.4", features = ["serde"] }

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# Web 框架 (健康检查)
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

# HTTP 客户端 (流量上报)
reqwest = { version = "0.11", features = ["json"] }

# 工具
hex = "0.4"
rand = "0.8"
hmac = "0.12"

# WebSocket
tokio-tungstenite = "0.21"
futures-util = "0.3"

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.2"

[[bin]]
name = "moon"
path = "src/main.rs"

[lib]
name = "shanlian_moon"
path = "src/lib.rs"
