[target.x86_64-unknown-linux-gnu]
linker = "clang"
args = ["-C", "target-cpu=native"]

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

[target.i686-pc-windows-gnu]
linker = "i686-w64-mingw32-gcc"

[target.aarch64-unknown-linux-gnu]
linker = "clang"
args = ["-C", "target-cpu=native"]

[build]
jobs = 4

[term]
verbose = false
